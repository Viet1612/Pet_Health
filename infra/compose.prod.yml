# Production (S7-01) chạy trên một máy (WSL2 Ubuntu hoặc VPS): build image ngay trên máy từ mã
# nguồn, không đẩy registry. Không publish cổng nào ra host: Internet → Cloudflare → cloudflared
# (tunnel đi ra) → caddy → api. Bí mật nằm ở /srv/pethealth/secrets/*.env (tạo bằng
# infra/ops/setup-secrets.sh, quyền 600), không vào repo.
#
#   Triển khai / cập nhật: infra/ops/deploy.sh
#   Xem trạng thái:        infra/ops/status.sh
name: ph-prod

x-common: &common
  restart: unless-stopped
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }
  labels: { autoheal: 'true' }

x-app: &app
  <<: *common
  image: ph-app:prod
  env_file: [/srv/pethealth/secrets/app.env]
  environment:
    NODE_ENV: production
    MEDIA_ROOT: /data/media
    HEARTBEAT_FILE: /tmp/alive
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  postgres:
    <<: *common
    image: postgres:16-bookworm
    stop_grace_period: 60s
    command:
      [
        'postgres',
        '-c',
        'shared_buffers=256MB',
        '-c',
        'max_connections=50',
        '-c',
        'idle_in_transaction_session_timeout=10s',
      ]
    env_file: [/srv/pethealth/secrets/postgres.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [db]
    deploy: { resources: { limits: { memory: 1g } } }

  # Chạy migration rồi thoát; api/worker chỉ lên khi migration xong.
  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: migrate
    restart: 'no'
    labels: {}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db]

  api:
    <<: *app
    command: api
    # api chỉ ghi được incoming/ (ảnh vừa nhận); ảnh đã xử lý ở R2 hoặc đọc-only.
    volumes:
      - media:/data/media:ro
      - media-incoming:/data/media/incoming:rw
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app, db, egress]
    deploy: { resources: { limits: { memory: 512m } } }

  worker:
    <<: *app
    command: worker
    volumes:
      - media:/data/media:rw
      - media-incoming:/data/media/incoming:rw
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', '/app/docker-entrypoint.sh', 'healthcheck-worker']
      interval: 30s
      retries: 3
      start_period: 30s
    networks: [db, egress]
    deploy: { resources: { limits: { memory: 768m } } }

  caddy:
    <<: *common
    build:
      context: ..
      dockerfile: infra/Dockerfile.caddy
    image: ph-caddy:prod
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz-caddy']
      interval: 30s
      retries: 3
    depends_on: [api]
    networks: [app, edge]
    deploy: { resources: { limits: { memory: 128m } } }

  # Cloudflare Tunnel (remotely-managed): public hostname trỏ http://caddy:8080 cấu hình trên
  # dashboard Cloudflare Zero Trust. Token ở secrets/cloudflared.env (TUNNEL_TOKEN).
  cloudflared:
    <<: *common
    image: cloudflare/cloudflared:2025.11.1
    command: ['tunnel', '--no-autoupdate', '--metrics', '0.0.0.0:2000', 'run']
    env_file: [/srv/pethealth/secrets/cloudflared.env]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on: [caddy]
    networks: [edge]

  # Khởi động lại container có healthcheck "unhealthy" (Docker chỉ tự chạy lại khi tiến trình chết).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment: { AUTOHEAL_CONTAINER_LABEL: autoheal, AUTOHEAL_INTERVAL: '15' }
    volumes: ['/var/run/docker.sock:/var/run/docker.sock']
    network_mode: none

volumes:
  pgdata:
  media:
  media-incoming:

networks:
  # caddy ↔ cloudflared (ra Internet qua tunnel)
  edge: {}
  # caddy ↔ api
  app: { internal: true }
  # api, worker, migrate ↔ postgres
  db: { internal: true }
  # api, worker ra Internet: R2, SMTP Gmail
  egress: {}
