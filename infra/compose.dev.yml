# Môi trường dev (S0-02). PostgreSQL 16 dùng bản cài sẵn của ServBay trên máy (127.0.0.1:5432),
# tạo user/database bằng infra/dev/init-db.sql. Compose chỉ chạy Mailpit để nhận email thử.
name: ph-dev
services:
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # giao diện web
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      retries: 10
