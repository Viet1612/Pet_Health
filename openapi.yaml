                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      required:
                        - id
                        - name
                        - breed
                        - sex
                        - birthDate
                        - ageMonths
                        - ageText
                        - description
                        - avatarUrl
                        - avatarThumbUrl
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                required:
                  - items
                additionalProperties: false
    post:
      summary: Thêm thú cưng (tối đa 10)
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                breed:
                  type: string
                sex:
                  description: MALE | FEMALE
                  type: string
                birthDate:
                  description: YYYY-MM-DD, không sau hôm nay
                  type: string
                description:
                  type:
                    - string
                    - "null"
      parameters:
        - schema:
            type: string
          in: header
          name: idempotency-key
          required: false
      responses:
