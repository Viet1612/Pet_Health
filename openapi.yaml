openapi: 3.1.0
info:
  title: Pet Health API
  version: 1.0.0
components:
  schemas: {}
paths:
  /healthz:
    get:
      summary: Tiến trình còn sống
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /readyz:
    get:
      summary: Sẵn sàng nhận request (kiểm DB)
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - unavailable
                required:
                  - status
                additionalProperties: false
servers:
  - url: /api/v1
