openapi: 3.1.0
info:
  title: Pet Health API
  version: 1.0.0
components:
  schemas: {}
paths:
  /healthz:
    get:
      summary: Tiến trình còn sống
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /readyz:
    get:
      summary: Sẵn sàng nhận request (kiểm DB)
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - unavailable
                required:
                  - status
                additionalProperties: false
  /analytics/events:
    post:
      summary: Ghi event sản phẩm (danh sách trắng, không dữ liệu cá nhân)
      tags:
        - analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                viewportW:
                  type: integer
                  minimum: 0
                  maximum: 10000
                events:
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        maxLength: 64
                      props:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      occurredAt:
                        type: string
                        maxLength: 40
                    required:
                      - name
              required:
                - viewportW
                - events
      responses:
        "204":
          description: Default Response
  /auth/register:
    post:
      summary: Đăng ký tài khoản
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                password:
                  type: string
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 50
                birthDate:
                  type: string
                  minLength: 1
                  description: YYYY-MM-DD, từ 1900-01-01 tới hôm nay
                timezone:
                  type: string
                locale:
                  type: string
                  enum:
                    - vi
                    - en
              required:
                - email
                - password
                - nickname
                - birthDate
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      nickname:
                        description: "null: tài khoản cũ chưa đặt nickname"
                        type:
                          - string
                          - "null"
                      birthDate:
                        anyOf:
                          - type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          - type: "null"
                        description: "null: tài khoản cũ chưa nhập ngày sinh"
                      emailVerified:
                        type: boolean
                      timezone:
                        type: string
                      locale:
                        type: string
                        enum:
                          - vi
                          - en
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - id
                      - email
                      - nickname
                      - birthDate
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                    additionalProperties: false
                  csrfToken:
                    type: string
                required:
                  - user
                  - csrfToken
                additionalProperties: false
  /auth/login:
    post:
      summary: Đăng nhập
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      nickname:
                        description: "null: tài khoản cũ chưa đặt nickname"
                        type:
                          - string
                          - "null"
                      birthDate:
                        anyOf:
                          - type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          - type: "null"
                        description: "null: tài khoản cũ chưa nhập ngày sinh"
                      emailVerified:
                        type: boolean
                      timezone:
                        type: string
                      locale:
                        type: string
                        enum:
                          - vi
                          - en
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - id
                      - email
                      - nickname
                      - birthDate
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                    additionalProperties: false
                  csrfToken:
                    type: string
                required:
                  - user
                  - csrfToken
                additionalProperties: false
  /auth/logout:
    post:
      summary: Đăng xuất
      tags:
        - auth
      responses:
        "204":
          description: Default Response
  /auth/session:
    get:
      summary: Phiên hiện tại và CSRF token
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      nickname:
                        description: "null: tài khoản cũ chưa đặt nickname"
                        type:
                          - string
                          - "null"
                      birthDate:
                        anyOf:
                          - type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          - type: "null"
                        description: "null: tài khoản cũ chưa nhập ngày sinh"
                      emailVerified:
                        type: boolean
                      timezone:
                        type: string
                      locale:
                        type: string
                        enum:
                          - vi
                          - en
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - id
                      - email
                      - nickname
                      - birthDate
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                    additionalProperties: false
                  csrfToken:
                    type: string
                  userIdHash:
                    type: string
                required:
                  - user
                  - csrfToken
                  - userIdHash
                additionalProperties: false
  /auth/verify-email:
    post:
      summary: Xác minh email bằng token trong liên kết
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      nickname:
                        description: "null: tài khoản cũ chưa đặt nickname"
                        type:
                          - string
                          - "null"
                      birthDate:
                        anyOf:
                          - type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          - type: "null"
                        description: "null: tài khoản cũ chưa nhập ngày sinh"
                      emailVerified:
                        type: boolean
                      timezone:
                        type: string
                      locale:
                        type: string
                        enum:
                          - vi
                          - en
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - id
                      - email
                      - nickname
                      - birthDate
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                    additionalProperties: false
                  purpose:
                    type: string
                    enum:
                      - VERIFY_EMAIL
                      - CHANGE_EMAIL
                required:
                  - user
                  - purpose
                additionalProperties: false
  /auth/verify-email/resend:
    post:
      summary: Gửi lại email xác minh
      tags:
        - auth
      responses:
        "202":
          description: Default Response
  /auth/password/forgot:
    post:
      summary: Gửi liên kết đặt lại mật khẩu
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
              required:
                - email
      responses:
        "202":
          description: Default Response
  /auth/password/reset:
    post:
      summary: Đặt mật khẩu mới bằng token trong liên kết
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
              required:
                - token
                - newPassword
      responses:
        "204":
          description: Default Response
  /me:
    get:
      summary: Thông tin tài khoản
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      nickname:
                        description: "null: tài khoản cũ chưa đặt nickname"
                        type:
                          - string
                          - "null"
                      birthDate:
                        anyOf:
                          - type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          - type: "null"
                        description: "null: tài khoản cũ chưa nhập ngày sinh"
                      emailVerified:
                        type: boolean
                      timezone:
                        type: string
                      locale:
                        type: string
                        enum:
                          - vi
                          - en
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      pendingEmail:
                        description: Email mới đang chờ xác nhận (liên kết 60 phút)
                        type:
                          - string
                          - "null"
                    required:
                      - id
                      - email
                      - nickname
                      - birthDate
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                      - pendingEmail
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
    patch:
      summary: Đổi múi giờ, nickname, ngày sinh (ít nhất một trường)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  description: IANA, ví dụ Asia/Ho_Chi_Minh
                  type: string
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 50
                birthDate:
                  type: string
                  minLength: 1
                  description: YYYY-MM-DD, từ 1900-01-01 tới hôm nay
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                      nickname:
                        description: "null: tài khoản cũ chưa đặt nickname"
                        type:
                          - string
                          - "null"
                      birthDate:
                        anyOf:
                          - type: string
                            format: date
                            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          - type: "null"
                        description: "null: tài khoản cũ chưa nhập ngày sinh"
                      emailVerified:
                        type: boolean
                      timezone:
                        type: string
                      locale:
                        type: string
                        enum:
                          - vi
                          - en
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    required:
                      - id
                      - email
                      - nickname
                      - birthDate
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                    additionalProperties: false
                required:
                  - user
                additionalProperties: false
    delete:
      summary: Xóa tài khoản cùng toàn bộ dữ liệu và ảnh
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
              required:
                - password
              additionalProperties: false
      responses:
        "204":
          description: Default Response
  /me/locale:
    patch:
      summary: Đổi ngôn ngữ của tài khoản
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum:
                    - vi
                    - en
              required:
                - locale
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale:
                    type: string
                    enum:
                      - vi
                      - en
                required:
                  - locale
                additionalProperties: false
  /me/password:
    post:
      summary: Đổi mật khẩu (giữ phiên hiện tại, hủy phiên khác)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "204":
          description: Default Response
  /me/email:
    post:
      summary: Yêu cầu đổi email (gửi liên kết xác nhận tới email mới)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newEmail:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - newEmail
                - password
              additionalProperties: false
      responses:
        "202":
          description: Default Response
  /pets:
    get:
      summary: Danh sách thú cưng
      tags:
        - pets
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        name:
                          type: string
                        breed:
                          type: string
                        sex:
                          type: string
                          enum:
                            - MALE
                            - FEMALE
                        birthDate:
                          type: string
                          format: date
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                        ageMonths:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        ageText:
                          type: string
                        description:
                          type:
                            - string
                            - "null"
                        avatarUrl:
                          type:
                            - string
                            - "null"
                        avatarThumbUrl:
                          type:
                            - string
                            - "null"
                        createdAt:
