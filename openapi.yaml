                    required:
                      - id
                      - email
                      - emailVerified
                      - timezone
                      - locale
                      - createdAt
                    additionalProperties: false
                  csrfToken:
                    type: string
                  userIdHash:
                    type: string
                required:
                  - user
                  - csrfToken
                  - userIdHash
                additionalProperties: false
  /auth/verify-email:
